<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<title>OCR Universal</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}

.container{
    width:800px;
    margin:50px auto;
    background:#ffffff;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    padding:30px;
}

h1{
    margin-top:0;
    color:#1f4e79;
}

.info{
    color:#666;
    margin-bottom:20px;
}

.barra-externa{
    width:100%;
    height:30px;
    background:#dddddd;
    border-radius:6px;
    overflow:hidden;
}

.barra-interna{
    width:0%;
    height:30px;
    background:#1f4e79;
}

.botao{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    text-decoration:none;
    display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>OCR Universal</h1>

<p class="info">
Processamento em andamento
</p>

<p>
Status:
<span id="status">Carregando...</span>
</p>

<p>
Progresso:
<span id="contador">0 / 0</span>
</p>

<div class="barra-externa">

<div
id="barra"
class="barra-interna">
</div>

</div>

<br>

<a
id="download"
class="botao">
Baixar Resultado
</a>

<br>

<p>
<a href="/">
Voltar para Página Inicial
</a>
</p>

</div>

<script>

const jobId = "{{ job_id }}";

function atualizarStatus() {

    fetch("/status/" + jobId)

    .then(response => response.json())

    .then(data => {

        document.getElementById("status").innerText =
            data.status;

        document.getElementById("contador").innerText =
            data.atual + " / " + data.total;

        let percentual =
            (data.atual / data.total) * 100;

        document.getElementById("barra").style.width =
            percentual + "%";

        if (data.status === "concluido") {

            document.getElementById("status").innerText =
                "Concluído";

            let download =
                document.getElementById("download");

            download.style.display =
                "inline-block";

            download.href =
                "/download/" + jobId;
        }

    });

}

setInterval(
    atualizarStatus,
    1000
);

atualizarStatus();

</script>

</body>

</html>
