<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="utf-8">
<title>OCR Universal</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:0;
}

.container{
    width:800px;
    margin:50px auto;
    background:#ffffff;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    padding:30px;
}

h1{
    margin-top:0;
    color:#1f4e79;
}

label{
    font-weight:bold;
}

input,
select{
    margin-top:5px;
    margin-bottom:20px;
}

.botao{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
}

.botao:hover{
    background:#163a59;
}

.info{
    color:#666;
    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Últimos Processamentos</h1>

<ul>

{% for job in jobs %}

<li>

{{ job.data }} - {{ job.nome }}

<a href="/download/{{ job.nome.replace('.zip','') }}">Baixar</a>

</li>

{% endfor %}

</ul>

<a href="/">
Voltar
</a>

</body>

</html>
